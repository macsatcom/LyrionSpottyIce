name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.9
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip libjson-xs-perl liburi-perl

      - name: Run tests
        run: prove -l t/

      - name: Set version from tag
        run: |
          VERSION="${TAG#v}"
          sed -i "s:<version>.*</version>:<version>${VERSION}</version>:" SpottyIce/install.xml
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          zip -qr "SpottyIce-${VERSION}.zip" SpottyIce -x '*.DS_Store'
          sha1sum "SpottyIce-${VERSION}.zip" | tee "SpottyIce-${VERSION}.zip.sha1"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "SpottyIce-${VERSION}.zip" "SpottyIce-${VERSION}.zip.sha1" --clobber
