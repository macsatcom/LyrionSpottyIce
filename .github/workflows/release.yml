name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.9
        required: true

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: src

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip libjson-xs-perl liburi-perl

      - name: Run tests
        working-directory: src
        run: prove -l t/

      - name: Set version from tag
        working-directory: src
        run: |
          VERSION="${TAG#v}"
          sed -i "s:<version>.*</version>:<version>${VERSION}</version>:" SpottyIce/install.xml
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=SpottyIce-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Build zip (install.xml at zip root, as LMS expects)
        run: |
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          cd src/SpottyIce
          zip -r "$OUT/$ZIP" . -x '*.DS_Store'
          cd "$OUT"
          ls -l
          SHA=$(sha1sum "$ZIP" | cut -d' ' -f1)
          echo "$SHA  $ZIP" > "$ZIP.sha1"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          unzip -Z1 "$ZIP" > files.txt
          grep -x install.xml files.txt

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: gh release upload "$TAG" "$ZIP" "$ZIP.sha1" --clobber -R "$GITHUB_REPOSITORY"

      - name: Check whether this is the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "IS_LATEST=$([ "$LATEST" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        if: env.IS_LATEST == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main

      - name: Update repo.xml on default branch
        if: env.IS_LATEST == 'true'
        working-directory: main
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          sh scripts/make-repo-xml.sh "$VERSION" "$SHA" "$URL" > repo.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.xml
          git diff --cached --quiet || { git commit -m "repo.xml: ${TAG}"; git push; }
